<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kai OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&family=JetBrains+Mono:wght@500&display=block">
<style>
  :root { --bg:#0B0A14; --ink:#F4F2FF; --muted:#9A93BF; --accent:#7C5CFF; --accent-2:#A78BFA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); }
  body { font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; color:var(--ink); position:relative; -webkit-font-smoothing:antialiased; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(124,92,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.12) 1px,transparent 1px); background-size:40px 40px; -webkit-mask-image:radial-gradient(75% 80% at 68% 50%,#000 30%,transparent 100%); }
  .glow { position:absolute; width:1000px; height:1000px; border-radius:50%; filter:blur(50px); }
  .g1 { right:-260px; top:-280px; background:radial-gradient(circle,rgba(124,92,255,.55),transparent 60%); }
  .g2 { left:-420px; bottom:-560px; background:radial-gradient(circle,rgba(167,139,250,.22),transparent 60%); }
  canvas { position:absolute; right:40px; top:35px; width:560px; height:560px; }
  .wrap { position:absolute; left:84px; top:90px; bottom:76px; width:600px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:14px; font-size:30px; font-weight:600; letter-spacing:-.01em; }
  .brand svg { width:40px; height:40px; }
  h1 { margin-top:auto; font-size:88px; line-height:.98; font-weight:800; letter-spacing:-.045em; }
  h1 em { font-style:normal; background:linear-gradient(135deg,#8E72FF,#C4B5FD); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  p { margin-top:28px; font-size:27px; line-height:1.35; color:var(--muted); font-weight:500; max-width:560px; }
  .dom { position:absolute; left:84px; bottom:72px; font:500 22px/1 'JetBrains Mono',monospace; letter-spacing:.08em; color:var(--accent-2); display:none; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
<canvas id="mark" width="1120" height="1120"></canvas>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M39.21 19.58A15.84 15.84 0 1 1 23.5 8.17" fill="none" stroke="#7C5CFF" stroke-width="6.72" stroke-linecap="round"/><circle cx="33.12" cy="11.44" r="3.36" fill="#A78BFA"/></svg>Kai</div>
  <h1>Set up your <em>CRM</em><br>without developers</h1>
  <p>An AI assistant that configures your CRM from a chat message.</p>
</div>
<script>
  // The Kai mark as the pixel field from the site's hero: ring + dot on a 48×48 cell grid, 2× for crispness.
  const R = 48, cv = document.getElementById('mark'), g = cv.getContext('2d');
  const off = document.createElement('canvas'); off.width = off.height = R; const o = off.getContext('2d');
  const c = R / 2, rad = R * 0.33, lw = R * 0.14, gc = -Math.PI * 0.30, gh = Math.PI * 0.21;
  o.lineCap = 'round'; o.lineWidth = lw; o.strokeStyle = '#fff'; o.fillStyle = '#fff';
  o.beginPath(); o.arc(c, c, rad, gc + gh, gc - gh + Math.PI * 2, false); o.stroke();
  const ring = o.getImageData(0, 0, R, R).data; o.clearRect(0, 0, R, R);
  const dr = rad * 0.98; o.beginPath(); o.arc(c + Math.cos(gc) * dr, c + Math.sin(gc) * dr, lw * 0.5, 0, Math.PI * 2); o.fill();
  const dot = o.getImageData(0, 0, R, R).data;
  const cell = cv.width / R, sz = cell * 0.62;
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  g.globalCompositeOperation = 'lighter';
  for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) {
    const i = (y * R + x) * 4 + 3, isRing = ring[i] > 120, isDot = dot[i] > 120;
    if (!isRing && !isDot) continue;
    const a = (isDot ? 1 : 0.55 + rnd() * 0.45), col = isDot ? '178,150,255' : '124,92,255';
    g.shadowColor = `rgba(${col},.9)`; g.shadowBlur = isDot ? 26 : 14;
    g.fillStyle = `rgba(${col},${a})`;
    g.fillRect(Math.round(x * cell + (cell - sz) / 2), Math.round(y * cell + (cell - sz) / 2), Math.ceil(sz), Math.ceil(sz));
  }
  // soft sparkle field around the mark
  g.shadowBlur = 0;
  for (let k = 0; k < 140; k++) {
    const ang = rnd() * 6.283, d = R * 0.42 + rnd() * R * 0.5, x = c + Math.cos(ang) * d, y = c + Math.sin(ang) * d;
    if (x < 0 || y < 0 || x >= R || y >= R) continue;
    g.fillStyle = `rgba(124,92,255,${0.08 + rnd() * 0.25})`;
    const s = sz * (0.35 + rnd() * 0.5);
    g.fillRect(Math.round(x * cell), Math.round(y * cell), Math.ceil(s), Math.ceil(s));
  }
</script>
</body>
</html>
